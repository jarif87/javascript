<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Cart Quantity</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="btn-1" onclick="console.log(`Cart quantity: ${cartQuantity}`)">
      Show Quantity
    </button>

    <button
      id="btn-2"
      onclick="
        cartQuantity++;
        console.log(`Cart quantity: ${cartQuantity}`);
      "
    >
      Add to Cart
    </button>

    <button
      id="btn-3"
      onclick="
        cartQuantity = cartQuantity + 2;
        console.log(`Cart quantity: ${cartQuantity}`);
      "
    >
      Add 2 to Cart
    </button>

    <button
      id="btn-4"
      onclick="
        cartQuantity = cartQuantity + 3;
        console.log(`Cart quantity: ${cartQuantity}`);
      "
    >
      Add 3 to Cart
    </button>

    <button
      id="btn-5"
      onclick="
        cartQuantity = 0;
        console.log(`Cart quantity: ${cartQuantity}`);
      "
    >
      Clear Cart
    </button>

    <script>
      let cartQuantity = 0;
    </script>
    <!-- <script src="script.js" async defer></script> -->
  </body>
</html>
