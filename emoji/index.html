<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smiley Hoodie</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="smiley-hoodie">
        <!-- Hoodie -->
        <div class="hoodie">
          <!-- Head / Smiley -->
          <div class="head">
            <div class="smiley">
              <div class="eyes">
                <div class="eye left"></div>
                <div class="eye right"></div>
              </div>
              <div class="mouth"></div>
            </div>
          </div>

          <!-- Hood -->
          <div class="hood"></div>

          <!-- Body -->
          <div class="body">
            <div class="text">X X D</div>
          </div>

          <!-- Arm + Hand holding heart -->
          <div class="arm">
            <div class="hand"></div>
            <div class="heart">❤️</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
