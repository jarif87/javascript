<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💰 Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- jsPDF + autoTable for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  </head>
  <body>
    <div class="app-container">
      <!-- ===== HEADER ===== -->
      <header class="app-header">
        <h1>💰 Smart Expense Tracker</h1>
        <div class="header-actions">
          <button
            class="btn-icon"
            id="darkModeToggle"
            aria-label="Toggle dark mode"
          >
            🌙
          </button>
          <button class="btn-icon" id="exportPdfBtn" aria-label="Export PDF">
            📄
          </button>
        </div>
      </header>

      <!-- ===== STATS ROW ===== -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-label">💰 Balance</span>
          <span class="stat-value" id="balanceDisplay">$0.00</span>
        </div>
        <div class="stat-card income-stat">
          <span class="stat-label">📈 Income</span>
          <span class="stat-value" id="incomeDisplay">$0.00</span>
        </div>
        <div class="stat-card expense-stat">
          <span class="stat-label">📉 Expenses</span>
          <span class="stat-value" id="expenseDisplay">$0.00</span>
        </div>
        <div class="stat-card savings-stat">
          <span class="stat-label">🏦 Savings</span>
          <span class="stat-value" id="savingsDisplay">$0.00</span>
        </div>
      </div>

      <!-- ===== SMART INSIGHTS ===== -->
      <div class="insights-bar" id="insightsBar">
        <span id="insightText">✨ Add transactions to see smart insights</span>
      </div>

      <!-- ===== MAIN GRID ===== -->
      <div class="main-grid">
        <!-- LEFT COLUMN: FORM + LIST -->
        <div class="left-col">
          <!-- ADD TRANSACTION -->
          <div class="card form-card">
            <h3>➕ Add Transaction</h3>
            <form id="transactionForm">
              <div class="form-row">
                <div class="input-group">
                  <label for="description">Description</label>
                  <input
                    type="text"
                    id="description"
                    placeholder="e.g. Groceries"
                    required
                  />
                </div>
                <div class="input-group">
                  <label for="amount">Amount ($)</label>
                  <input
                    type="number"
                    id="amount"
                    placeholder="0.00"
                    step="0.01"
                    required
                  />
                </div>
              </div>
              <div class="form-row">
                <div class="input-group">
                  <label for="category">Category</label>
                  <select id="category">
                    <option value="Food">🍔 Food</option>
                    <option value="Travel">✈️ Travel</option>
                    <option value="Salary">💼 Salary</option>
                    <option value="Bills">📄 Bills</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Entertainment">🎬 Entertainment</option>
                    <option value="Health">🏥 Health</option>
                    <option value="Other">📦 Other</option>
                  </select>
                </div>
                <div class="input-group">
                  <label for="date">Date</label>
                  <input type="date" id="date" required />
                </div>
              </div>
              <div class="form-row type-row">
                <div class="type-options">
                  <label class="radio-label">
                    <input type="radio" name="type" value="income" checked />
                    💵 Income
                  </label>
                  <label class="radio-label expense-label">
                    <input type="radio" name="type" value="expense" />
                    💳 Expense
                  </label>
                </div>
                <button type="submit" class="btn-primary">➕ Add</button>
              </div>
            </form>
          </div>

          <!-- FILTERS -->
          <div class="card filter-card">
            <div class="filter-grid">
              <div class="filter-group">
                <label>Type</label>
                <select id="filterType">
                  <option value="all">All</option>
                  <option value="income">Income</option>
                  <option value="expense">Expense</option>
                </select>
              </div>
              <div class="filter-group">
                <label>Category</label>
                <select id="filterCategory">
                  <option value="all">All</option>
                  <option value="Food">Food</option>
                  <option value="Travel">Travel</option>
                  <option value="Salary">Salary</option>
                  <option value="Bills">Bills</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Health">Health</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div class="filter-group">
                <label>Date from</label>
                <input type="date" id="filterDateFrom" />
              </div>
              <div class="filter-group">
                <label>Date to</label>
                <input type="date" id="filterDateTo" />
              </div>
              <div class="filter-group search-group">
                <label>Search</label>
                <input
                  type="text"
                  id="filterSearch"
                  placeholder="Search description..."
                />
              </div>
            </div>
          </div>

          <!-- TRANSACTION LIST -->
          <div class="card list-card">
            <div class="list-header">
              <h3>📋 Transactions</h3>
              <span id="transactionCount">0</span>
            </div>
            <ul id="transactionList" class="transaction-list">
              <!-- dynamically inserted -->
            </ul>
            <div id="emptyMessage" class="empty-msg">
              No transactions found. Add one above!
            </div>
          </div>
        </div>

        <!-- RIGHT COLUMN: CHARTS -->
        <div class="right-col">
          <!-- BAR CHART: MONTHLY TREND -->
          <div class="card chart-card">
            <h3>📊 Monthly Income vs Expense</h3>
            <div class="chart-wrapper">
              <canvas id="monthlyChart"></canvas>
            </div>
          </div>

          <!-- BAR CHART: CATEGORY BREAKDOWN -->
          <div class="card chart-card">
            <h3>📊 Category Breakdown</h3>
            <div class="chart-wrapper">
              <canvas id="categoryChart"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
