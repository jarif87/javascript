<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCARY JOKER</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="joker">
        <div class="face">
          <!-- Eyes -->
          <div class="eye left"></div>
          <div class="eye right"></div>

          <!-- Eyebrows -->
          <div class="eyebrow left"></div>
          <div class="eyebrow right"></div>

          <!-- Nose -->
          <div class="nose"></div>

          <!-- Terrifying Mouth -->
          <div class="mouth">
            <div class="teeth"></div>
          </div>

          <!-- Bloody Scars -->
          <div class="scar left"></div>
          <div class="scar right"></div>
        </div>

        <!-- Hair -->
        <div class="hair"></div>
      </div>
    </div>

    <h2>WHY SO SERIOUS?</h2>
  </body>
</html>
