<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Water Gun Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="game">
      <h1>🐍💧🔫 Snake Water Gun</h1>
      <p>
        Choose your move! Snake beats Water, Water beats Gun, Gun beats Snake.
      </p>
      <div id="choices">
        <button onclick="play('snake')">🐍 Snake</button>
        <button onclick="play('water')">💧 Water</button>
        <button onclick="play('gun')">🔫 Gun</button>
      </div>
      <div id="result"></div>
      <div id="score">Player: 0 | Computer: 0</div>
      <button id="reset" onclick="resetScore()">Reset Score</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
