<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css"
    />
  </head>
  <body>
    <div id="auth" class="auth-screen">
      <div class="auth-card">
        <div class="logo">
          <i class="fa-solid fa-note-sticky"></i>
          <h1>Notes</h1>
        </div>
        <p>Professional note-taking. Sign in to begin.</p>
        <div class="signin-center">
          <div id="google-signin-button"></div>
        </div>
      </div>
    </div>

    <div id="app" class="app" style="display: none">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Your Notes</h2>
          <button id="new-note" aria-label="New note">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
        <ul id="notes-list"></ul>
      </aside>

      <main class="main">
        <header class="editor-header">
          <input
            type="text"
            id="note-title"
            placeholder="Untitled note"
            autocomplete="off"
            aria-label="Note title"
          />
          <div class="header-actions">
            <button id="save-btn" aria-label="Save note">
              <i class="fa-solid fa-floppy-disk"></i> Save
            </button>
            <button id="delete-btn" aria-label="Delete note">
              <i class="fa-solid fa-trash-can"></i>
            </button>
            <div class="user-info">
              <span id="user-name"></span>
              <button id="signout-btn" aria-label="Sign out">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            </div>
          </div>
        </header>

        <div id="toolbar"></div>
        <div id="editor"></div>
      </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
